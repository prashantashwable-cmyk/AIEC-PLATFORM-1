name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiec
          POSTGRES_PASSWORD: aiec
          POSTGRES_DB: aiec_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aiec" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://aiec:aiec@localhost:5432/aiec_test
      TEST_DATABASE_URL: postgres://aiec:aiec@localhost:5432/aiec_test
      AUTH_SANDBOX: 'true'
      APP_SECRET: ci-only-secret-0123456789abcdef
      RECONCILIATION_WEBHOOK_SECRET: ci-only-webhook-secret
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx tsx scripts/i18n-scan.ts
      - run: npm test
      - run: npm run build
